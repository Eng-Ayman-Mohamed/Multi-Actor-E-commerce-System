<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div >
    <div id="navbar-container"></div>

<div class="container-fluid py-4">
  <div class="products-header mb-4">
  <h5 class="mb-1">All Products</h5>
  <p class="mb-0 text-muted">
    Showing <span id="productsCount">1-20</span> of 30 products
  </p>
</div>

  <div class="row">

    <!-- Filters -->
    <aside class="col-md-3" id="filters"></aside>

    <!-- Products -->
    <main class="col-md-9">

      <!-- Sort -->
      <div class="sort-wrapper mb-3">
  <div class="sort-card">
    <span>Sort by:</span>
    <select id="sortSelect">
      <option value="featured">Featured</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="rating">Highest Rated</option>
    </select>
  </div>
</div>


      <div id="products" class="row g-4"></div>
      <div id="pagination" class="mt-4 text-center"></div>

    </main>

  </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS Files -->
 
<script src="./js/api.js"></script>
<script src="./js/filters.js"></script>
<script src="./js/products.js"></script>
<script src="./js/pagination.js"></script>
<script src="./js/app.js"></script>
  </div>

</body>
</html>
