<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <title>Seller Dashboard</title>
  <link rel="stylesheet" href="./assets/style.css">
  <!-- Jquery -->
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- index.html -->
  <script type="module" src="./main.js"></script>

<body>
  <div class="container-fluid ">
    <div class="row">

      <!-- Sidebar / Nav -->
      <nav class="col-2 bg-dark text-white d-flex flex-column vh-100 p-3">
        <div style="display: flex; justify-content: center;"> <img style="margin: 4px; transform: scale(.8);"
            src="./assets/e.png">
          <h4>Seller portal</h4>
        </div>
        <ul class="mt-5 d-flex p-0">
          <li id="u"><i class="fa-solid fa-list-ul"></i></i>
            <span>Overview</span>
          </li>
          <li>
            <i class="fas fa-box"></i>
            <span>Products</span>
          </li>
          <li><i class="fas fa-shopping-cart"></i><span>Orders</span></li>
          <li><i class="fas fa-chart-line"></i> <span>Analytics</span></li>
          <li><i class="fas fa-cog"></i> <span>Settings</span></li>
          <li><i class="fas fa-sign-out-alt"></i><span>back to store</span></li>
        </ul>
      </nav>

      <!-- Main area -->
      <div class="col-10 p-0  ">
        <header class=" d-flex justify-content-between align-items-center ">
          <!-- Header -->
          <div>
            <h3>Overview</h3>
          </div>
          <div class="d-flex">
            <div><img style="margin: 4px; transform: scale(.8);" src="./assets/ss.png"></div>
            <div>
              <h5>Welcome back</h5>
              <h5>Seller name</h5>
            </div>
          </div>
        </header>
        <main class=" bg-light p-0  shadow-lg" style="min-height: 80vh;">
          <div id="content" class="p-0"></div>
        </main>
      </div>
    </div>
  </div>
