<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendra | Profile</title>

  <link rel="icon" type="image/x-icon" href="/assets/vendra.png" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="./auth.css">

  <!-- IMPORTANT: module script at bottom recommended -->
  <script type="module" src="./auth.js" defer></script>
</head>

<body id="container">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="card shadow-sm rounded-4 border-0">
          <div class="card-body p-4">

            <h3 class="mb-4 fw-bold text-center">My Profile</h3>

            <form id="profileForm" novalidate>

              <!-- Profile Image -->
              <div class="text-center mb-4">
                <div class="position-relative d-inline-block">
                  <img id="profilePreview"
                       src="https://via.placeholder.com/150"
                       class="rounded-circle border shadow"
                       width="150"
                       height="150"
                       style="object-fit: cover;">

                  <label for="profileImage"
                         class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle p-2"
                         style="cursor: pointer;">
                    <i class="fa fa-camera"></i>
                  </label>

                  <input type="file"
                         id="profileImage"
                         name="profileImage"
                         accept="image/*"
                         hidden>
                </div>
              </div>

              <!-- Name -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" name="name" required>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" name="email" readonly>
              </div>

              <!-- Role -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Role</label>
                <input type="text" class="form-control" name="role" readonly>
              </div>

              <!-- Phone -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Phone</label>
                <input type="tel" class="form-control" name="phone">
                <div class="invalid-feedback"></div>
              </div>

              <!-- Address -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Address</label>
                <input type="text" class="form-control" name="address">
              </div>

              <!-- City -->
              <div class="mb-3">
                <label class="form-label fw-semibold">City</label>
                <input type="text" class="form-control" name="city">
              </div>

              <!-- Country -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Country</label>
                <input type="text" class="form-control" name="country">
              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">
                  Update Profile
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
