<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>
            Create Account
        </title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="./auth.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>

    <body class="bg-light" id="container">

        <div class="container min-vh-100 d-flex justify-content-center align-items-center">
            <div class="w-100" style="max-width: 520px;">

                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center mx-auto mb-3"
                        style="width:70px; height:70px;">
                        <i class="fa-regular fa-user fs-4">
                        </i>
                    </div>

                    <h2 class="fw-bold">
                        Create Account
                    </h2>
                    <p class="text-muted">
                        Join our marketplace today
                    </p>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">

                        <form method="post" novalidate>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Register As
                                </label>
                                <div class="d-flex gap-3">
                                    <button type="button" class="btn role-btn active flex-fill">
                                        Customer
                                    </button>
                                    <button type="button" class="btn role-btn flex-fill">
                                        Seller
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Username
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa-regular fa-user text-muted">
                                        </i>
                                    </span>
                                    <input type="text" class="form-control border-start-0" name="username" placeholder="Enter your username" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa-regular fa-envelope text-muted">
                                        </i>
                                    </span>
                                    <input type="email" class="form-control border-start-0" name="email" placeholder="Enter your email" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Phone Number
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa-solid fa-phone text-muted">
                                        </i>
                                    </span>
                                    <input type="tel" class="form-control border-start-0" name="phone" placeholder="Enter your phone number" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Password
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa-solid fa-lock text-muted">
                                        </i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 border-end-0"
                                        id="regPassword" name="password" placeholder="Enter your password">
                                    <button class="input-group-text bg-white border-start-0" type="button"
                                        onclick="togglePassword('regPassword', this)">
                                        <i class="fa-regular fa-eye text-muted">
                                        </i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    Confirm Password
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa-solid fa-lock text-muted">
                                        </i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 border-end-0"
                                        id="confirmPassword" name="confirm_password" placeholder="Confirm your password">
                                    <button class="input-group-text bg-white border-start-0" type="button"
                                        onclick="togglePassword('confirmPassword', this)">
                                        <i class="fa-regular fa-eye text-muted">
                                        </i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" required>
                                <label class="form-check-label small">
                                    I agree to the Terms and Conditions and Privacy Policy
                                </label>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary py-2">
                                    Create Account
                                </button>
                            </div>

                            <p class="text-center mt-3 small">
                                Already have an account?
                                <a href="./login.html" class="text-decoration-none">
                                    Sign in
                                </a>
                            </p>

                        </form>

                    </div>
                </div>

            </div>
        </div>

        <script type="module" src="./auth.js">
        </script>

    </body>
</html>
