<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Vendra | Register
    </title>
    <link rel="icon" type="image/x-icon" href="/assets//vendra.png">

    <!-- Jquery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <script type="module" src="./auth.js"></script>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="./auth.css">

</head>

<body id="container">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="w-100" style="max-width: 520px;">

            <div class="text-center mb-4">
                <div class="bg-primary  rounded-circle d-flex justify-content-center align-items-center mx-auto mb-3"
                    style="width:70px; height:70px;">
                    <i class="fa-regular fa-user fs-4">
                    </i>
                </div>

                <h2 class="fw-bold">
                    Create Account
                </h2>
                <p class="text-muted">
                    Join our marketplace today
                </p>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">

                    <form method="post" novalidate>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Register As
                            </label>
                            <div class="d-flex gap-3">
                                <button type="button" class="btn role-btn active flex-fill">
                                    Customer
                                </button>
                                <button type="button" class="btn role-btn flex-fill">
                                    Seller
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Username
                            </label>
                            <div class="input-group">
                                <span class="input-group-text  border-end-0">
                                    <i class="fa-regular fa-user text-muted">
                                    </i>
                                </span>
                                <input type="text" class="form-control border-start-0" name="username"
                                    placeholder="Enter your username" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Email Address
                            </label>
                            <div class="input-group">
                                <span class="input-group-text  border-end-0">
                                    <i class="fa-regular fa-envelope text-muted">
                                    </i>
                                </span>
                                <input type="email" class="form-control border-start-0" name="email"
                                    placeholder="Enter your email" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Phone Number
                            </label>
                            <div class="input-group">
                                <span class="input-group-text  border-end-0">
                                    <i class="fa-solid fa-phone text-muted">
                                    </i>
                                </span>
                                <input type="tel" class="form-control border-start-0" name="phone"
                                    placeholder="Enter your phone number" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Password
                            </label>
                            <div class="input-group">
                                <span class="input-group-text  border-end-0">
                                    <i class="fa-solid fa-lock text-muted">
                                    </i>
                                </span>
                                <input type="password" class="form-control border-start-0 border-end-0" id="regPassword"
                                    name="password" placeholder="Enter your password">
                                <button class="input-group-text  border-start-0" type="button"
                                    onclick="togglePassword('regPassword', this)">
                                    <i class="fa-regular fa-eye text-muted">
                                    </i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Confirm Password
                            </label>
                            <div class="input-group">
                                <span class="input-group-text  border-end-0">
                                    <i class="fa-solid fa-lock text-muted">
                                    </i>
                                </span>
                                <input type="password" class="form-control border-start-0 border-end-0"
                                    id="confirmPassword" name="confirm_password" placeholder="Confirm your password">
                                <button class="input-group-text  border-start-0" type="button"
                                    onclick="togglePassword('confirmPassword', this)">
                                    <i class="fa-regular fa-eye text-muted">
                                    </i>
                                </button>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" required>
                            <label class="form-check-label small">
                                I agree to the Terms and Conditions and Privacy Policy
                            </label>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary py-2">
                                Create Account
                            </button>
                        </div>

                        <p class="text-center mt-3 small">
                            Already have an account?
                            <a href="./login.html" class="text-decoration-none">
                                Sign in
                            </a>
                        </p>

                    </form>

                </div>
            </div>

        </div>
    </div>


</body>

</html>
