<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vendra | Products</title>
  <link rel="icon" type="image/x-icon" href="../../assets//vendra.png">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>

<body>
  <div id="mainWrapper">

    <div class="container-fluid py-4">

      <div class="products-header shadow-lg mb-4 d-flex justify-content-between flex-column flex-lg-row">
        <div>
          <h5 class="mb-1">All Products</h5>
          <p class="mb-0 text-muted">
            Showing <span id="productsCount">1-20</span> of 30 products
          </p>
        </div>
        <!-- Search -->
        <input class="form-control rounded w-75 align-self-center  my-3" type="search" placeholder="Search products...">

      </div>

      <div class="row">
        <!-- Filters -->
        <aside class="col-md-3" id="filters"></aside>
        <!-- Products -->
        <main class="col-md-9">
          <!-- Sort -->
          <div class="sort-wrapper mb-3">
            <div class="sort-card shadow-lg">
              <span>Sort by:</span>
              <select class="form-select w-25" id="sortSelect">
                <option value="featured">Featured</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
              </select>
            </div>
          </div>

          <div id="products" class="row g-4">
            <div class="w-100 d-flex justify-content-center align-items-center" style="height: 50vh;">
              <div class="spinner-border text-body " role="status"
                style="height: 100px !important; width: 100px !important;">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
          <div id="pagination" class="mt-4 text-center"></div>

        </main>

      </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS Files -->
    <script src="./js/filters.js"></script>
    <script src="./js/products.js"></script>
    <script src="./js/app.js" type="module"></script>
  </div>

</body>

</html>
