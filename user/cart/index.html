<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendra | Sell Smarter. Buy Faster.</title>
    <link rel="icon" type="image/x-icon" href="./assets/vendra.png">

    <!-- Jquery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../..//assets/css/global.css">

    <script type="module">
        import { getBasePath } from "../../assets/utils/basePath.js";
        import { navbar, initNavBar } from "../../components/user/navbar.js";
        import { footer, initFooter } from "../../components/user/footer.js";
        //Nav Bar initialization
        import { cartService } from "../../DataBase/services/cartService.js";
        import { userService } from "../../DataBase/services/userService.js";
        import { productService } from "../../DataBase/services/productService.js";
        let userId = userService.getCurrentUser().id;

        function updateCartCount() {
            /* ===== Cart Count ===== */
            let userId = userService.getCurrentUser().id;
            $("#cartCount").text(cartService.getCartCount(userId));
            $("#cartCountMobile").text(cartService.getCartCount(userId));
        }

        $("body").prepend(navbar(getBasePath())).append(footer(getBasePath()));
        initNavBar();
        initFooter(getBasePath());
        updateCartCount();

        function cartItem(product, element) {
            return `
               <div class="card border-0 border-bottom rounded-0 ">
                <div class="row g-0">
                    <div class="col-md-3 d-flex align-middle">
                         <img src="${product.images[0]}" class="img-fluid rounded-start" >
                    </div>
                    <div class="col-md-3 ">
                        <div class="card-body">
                            <h5 class="card-title">${product.title}</h5>
                            <p class="card-text">${product.finalPrice.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="col-md-3 d-flex align-items-center justify-content-center">
                         <div class="input-group" style="width:130px;">
                            <button class="btn btn-outline-secondary" id="minus">-</button>
                            <input type="text" id="qty" class="form-control text-center" value="${element.quantity}">
                            <button class="btn btn-outline-secondary" id="plus">+</button>
                        </div>
                    </div>
                    <div class="col-md-3 ">
                        <div>
                            <p class="card-text">${product.finalPrice.toFixed(2)}</p>
                            <button class="btn btn-danger">Delete</button>
                        </div>
                    </div>
                </div>
                </div>
                
            `;
        }
        cartService.getCart(userId).items.forEach(element => {
            let product = productService.getById(element.productId)
            $("#mainCartWrapper").append(cartItem(product, element))

        });
    </script>

<body class="d-flex flex-column justify-content-between min-vh-100">
    <div class="container-lg">
        <div id="secondaryWrapper" class="row ">
            <div id="mainCartWrapper" class="col-12 col-xl-8 shadow">
            </div>
            <div id="mainCartDetails" class="col-12 col-xl-4"> hello</div>
        </div>
    </div>

</body>

</html>
