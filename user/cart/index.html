<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vendra | Shopping Cart</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/global.css">

  <style>
    body { background: #f5f6f8; }
    .cart-card, .summary-card {
      background: #fff;
      border-radius: 12px;
    }
  </style>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

<script type="module">
import { getBasePath } from "../../assets/utils/basePath.js";
import { navbar, initNavBar } from "../../components/user/navbar.js";
import { footer, initFooter } from "../../components/user/footer.js";

import { cartService } from "../../DataBase/services/cartService.js";
import { userService } from "../../DataBase/services/userService.js";
import { productService } from "../../DataBase/services/productService.js";

let userId = userService.getCurrentUser().id;

/* ===== Navbar / Footer ===== */
$("body").prepend(navbar(getBasePath())).append(footer(getBasePath()));
initNavBar();
initFooter(getBasePath());

/* ===== Cart Item Layout (NEW UI فقط) ===== */
function cartItem(product, element) {
  let total = (product.finalPrice * element.quantity).toFixed(2);

  return `
  <div class="border-bottom p-3">
    <div class="row align-items-center">

      <div class="col-3 col-md-2">
        <img src="${product.images[0]}" class="img-fluid rounded">
      </div>

      <div class="col-9 col-md-4">
        <h6 class="mb-1">${product.title}</h6>
        <span class="text-primary fw-semibold">$${product.finalPrice.toFixed(2)}</span>
      </div>

      <div class="col-6 col-md-3 mt-2 mt-md-0">
        <div class="input-group" style="width:120px;">
          <button class="btn btn-outline-secondary">−</button>
          <input type="text" class="form-control text-center" value="${element.quantity}" readonly>
          <button class="btn btn-outline-secondary">+</button>
        </div>
      </div>

      <div class="col-6 col-md-3 text-end mt-2 mt-md-0">
        <div class="fw-semibold">$${total}</div>
        <button class="btn btn-sm text-danger">
          <i class="fa fa-trash"></i>
        </button>
      </div>

    </div>
  </div>`;
}

/* ===== Render Cart ===== */
function renderCart() {
  const cart = cartService.getCart(userId);
  $("#mainCartWrapper").html("");

  if (!cart.items.length) {
    $("#mainCartWrapper").html(`
      <div class="text-center p-5 text-muted">
        <i class="fa fa-cart-shopping fa-2x mb-3"></i>
        <h5>Cart is empty</h5>
      </div>
    `);
    updateSummary(0);
    return;
  }

  let subtotal = 0;

  cart.items.forEach(item => {
    let product = productService.getById(item.productId);
    subtotal += product.finalPrice * item.quantity;
    $("#mainCartWrapper").append(cartItem(product, item));
  });

  updateSummary(subtotal);
}

/* ===== Summary ===== */
function updateSummary(subtotal) {
  let tax = subtotal * 0.08;
  let total = subtotal + tax;

  $("#subtotal").text(`$${subtotal.toFixed(2)}`);
  $("#tax").text(`$${tax.toFixed(2)}`);
  $("#total").text(`$${total.toFixed(2)}`);
}

renderCart();
</script>

<!-- ===== Page Layout ===== -->
<div class="container py-5">
  <h2 class="fw-bold mb-4">Shopping Cart</h2>

  <div class="row g-4">

    <!-- Cart Items -->
    <div class="col-12 col-xl-8">
      <div id="mainCartWrapper" class="cart-card shadow-sm"></div>
      <a href="../products/index.html" class="text-decoration-none d-block mt-3">
        ← Continue Shopping
      </a>
    </div>

    <!-- Summary -->
    <div class="col-12 col-xl-4">
      <div class="summary-card shadow-sm p-4">
        <h5 class="fw-bold mb-3">Order Summary</h5>

        <div class="d-flex justify-content-between mb-2">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
          <span>Shipping</span>
          <span class="text-success">FREE</span>
        </div>

        <div class="d-flex justify-content-between mb-3">
          <span>Tax (8%)</span>
          <span id="tax">$0.00</span>
        </div>

        <hr>

        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
          <span>Total</span>
          <span class="text-primary" id="total">$0.00</span>
        </div>

        <button class="btn btn-primary w-100 py-2">
          Proceed to Checkout
        </button>

        <p class="text-center text-muted small mt-2">
          Secure checkout powered by Stripe
        </p>
      </div>
    </div>

  </div>
</div>

</body>
</html>
